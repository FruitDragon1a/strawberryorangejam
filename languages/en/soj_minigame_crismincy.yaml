questions:
  - q: I know I'm not spelling this right.\! How do you spell \"retoric\"?
    a1: Rhetorique
    a2: Rhetoric
    a3: Retoric
    c: 2
  - q: Oh how about this.\! In this sentence,\.<br>\fs[20]\"The author uses mostly anecdotes[*] this creates a weak pool of evidence.\"\fs[24]\!<br>What should I put in place of \"[*]\"?
    a1: Semicolon
    a2: Colon
    a3: Comma
    c: 1
  - q: Ok I know I should know by now,\. but in this sentence,\.<br>\fs[20]\"A major weakness is that [*] failing to properly account for the audience.\"\!\fs[24]<br>Is is \"there\", \"they're\", or \"their\"?
    a1: There
    a2: They're
    a3: Their
    c: 2
  - q: This is content question actually but,\. read this quote,\.<br>\fs[20]\"Based on a BMRF study, 'minimalistic' languages can communicate all concepts.\"\!\fs[24]<br>What kind of evidence is that?
    a1: Testimonial
    a2: Statistic
    a3: Experiment
    c: 3
  - q: I don't even know why I expect you to know this but,\. what kind of article is \"the\"?
    a1: Demonstrative
    a2: Indefinite
    a3: Definite
    c: 3

