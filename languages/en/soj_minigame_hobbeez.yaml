intro_0:
  name: SHOPKEEP
  text: \}Where should this comic go...

intro_1:
  faceset: SOJ_KEL
  faceindex: 2
  text: Hey, SHOPKEEP!\! What's up?\kel

# turns to them, exclamation bubble
intro_2:
  text: Oh!\! KEL! BASIL! How've you two been?\n<SHOPKEEP>

intro_3:
  text: Wait a second. What are you doing here?\! I put the 'CLOSED' sign outside for a reason!\n<SHOPKEEP>

intro_4:
  faceset: SOJ_KEL
  faceindex: 3
  text: Oh, oops.\! We didn't see it.\kel

intro_5:
  faceset: SOJ_BASIL
  faceindex: 3
  text: You look worried...\| Is something wrong?\bas

intro_6:
  text: Ahaha, everything's fine!\! It's just...\| the HOBBEEZ chain inspector is showing up in about twenty minutes and I'm not done cleaning the shop.\n<SHOPKEEP>

intro_7:
  text: It'll be fine, though!\! Just gotta finish sorting these old comics...\| then take out the trash...\| then dust the shelves...\| then sort the back room...\n<SHOPKEEP>

# pedro sweat bubble
intro_8:
  faceset: SOJ_KEL
  faceindex: 4
  text: Oh wow, that's a lot!\kel

intro_9:
  faceset: SOJ_KEL
  faceindex: 10
  text: Are you sure you can finish all that in twenty minutes?\kel

intro_10:
  text: I don't have a choice, so...\| yeah?\n<SHOPKEEP>

intro_11:
  faceset: SOJ_BASIL
  faceindex: 3
  text: ...\bas

intro_12:
  faceset: SOJ_KEL
  faceindex: 5
  text: Hey, wait, what if BASIL and I help you?\kel

intro_13:
  text: ...What?\n<SHOPKEEP>

intro_14:
  faceset: SOJ_KEL
  faceindex: 2
  text: I can totally dust shelves! And BASIL can sort comics, so that'll leave you with the trash and the back room!\kel

intro_15:
  text: Oh wow, you'd do that? Thank you!\n<SHOPKEEP>

intro_16:
  text: I can't let you do it for free, though.\| I'll pay you!\n<SHOPKEEP>

intro_17:
  faceset: SOJ_KEL
  faceindex: 3
  text: Wow, really?\! Thanks!\kel

intro_18:
  text: No, thank you!\n<SHOPKEEP>

# start minigame




# end minigame
# kel walks over to basil

outro_0:
  faceset: SOJ_KEL
  faceindex: 2
  text: I just finished!\kel

outro_1:
  faceset: SOJ_BASIL
  faceindex: 22
  text: Me too.\bas

outro_2:
  faceset: SOJ_KEL
  faceindex: 2
  text: Wow, perfect timing!\kel

# pedro returns from the back room
outro_3:
  text: Oh, you both are done?\! Thank you so much!\n<SHOPKEEP>

outro_4:
  text: Let me take a look at your work...\n<SHOPKEEP>

# fade out
# wait a bit
# fade in

outro_5:
  text: KEL, you really have a talent for dusting shelves.\! Nice job!\n<SHOPKEEP>

outro_6:
  faceset: SOJ_KEL
  faceindex: 2
  text: Thanks!\kel

#Any less
outro_7:
  text: As for you, BASIL...\n<SHOPKEEP>

# if 12 correct/perfect accuracy, prize $40
outro_8:
  text: Wow, you were spot on!\! Not a single comic is out of place.\n<SHOPKEEP>

# if 7-11 correct
outro_9:
  text: There's a few I would have sorted differently, but nice job!\n<SHOPKEEP>

# if 6 or less correct
outro_10:
  text: Hmm...\| Well, you tried.\! I appreciate it anyway.\n<SHOPKEEP>

outro_11:
  text: Here's $\v[112] for both of your help!\! Don't spend it all in one place!\n<SHOPKEEP>

outro_12:
  faceset: SOJ_KEL
  faceindex: 2
  text: Thanks, SHOPKEEP!\kel

outro_13:
  faceset: SOJ_BASIL
  faceindex: 1
  text: Yeah, thanks.\bas

outro_14:
  text: No problem!\! You two should probably head out.\! The inspector will be here any minute.\n<SHOPKEEP>

outro_15:
  faceset: SOJ_KEL
  faceindex: 0
  text: Alright!\! See ya!\kel
