questions:
  - q: What is the name of the process that the cells in a plant use to divide and make copies of themselves?
    a1: Meiosis
    a2: Mitosis
    a3: Photosynthesis
    c: 2
  - q: What importance does photosynthesis have to the carbon cycle?
    a1: Photosynthesis isn't relevant to the carbon cycle
    a2: It takes in carbon dioxide and releases nitrogen
    a3: It takes in carbon dioxide and releases oxygen
    c: 3
  - q: Which cell organelle stores and protects chromosomes?
    a1: Nucleolus
    a2: Endoplasmic Reticulum
    a3: Nucleus
    c: 3
  - q: How does a prokaryotic cell differ from a eukaryotic cell?
    a1: It has less organelles and structure
    a2: It has more organelles and structure
    a3: They are two different names for the same thing
    c: 1
  - q: How does a plant absorb energy from the sun?
    a1: It uses a process called lumicaption
    a2: It creates a pigment called chlorophyll
    a3: It secretes a chemical called photosynthol
    c: 2
  - q: What is a Punnet Square used to predict?
    a1: The probability of genes being passed to offspring
    a2: The likelihood of a parent having offspring
    a3: The chance of an offspring surviving to adulthood
    c: 1

