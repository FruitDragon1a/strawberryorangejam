zero_1:
  name: PREACHER
  text: Hm.\|.\|.\! Did you two clean.\|.\|.\| any of the leaves?

zero_2:
  faceset: SOJ_KEL
  faceindex: 8
  text: About that.\..\..\kel

zero_3:
  faceset: SOJ_BASIL
  faceindex: 15
  text: .\|.\|.\|\bas

zero_4:
  name: PREACHER
  text: Ah.\! I see.\! I can't pay you for not doing any work,\. though.

zero_5:
  faceset: SOJ_KEL
  faceindex: 5
  text: That's alright!\| We wouldn't ask you to.\kel

zero_6:
  name: PREACHER
  text: I suppose you may still visit your friend,\. though.

zero_7:
  faceset: SOJ_BASIL
  faceindex: 42
  text: Thank you.\bas




