yard_primrose_1:
  faceset: SOJ_BASIL
  faceindex: 10
  text: These are \c[4]PINK PRIMROSES\c[0].\! The color doesn't affect the meaning much,\. aside from pink usually meaning peace and young love.<br>The \c[4]PRIMROSE\c[0] represents childhood and eternal love,\. and it also means \"I can't live without you.\"\bas

