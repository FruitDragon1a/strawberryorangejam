intro_0:
  name: SHOPKEEP
  text: Ugh...\! Why don't they send this stuff in smaller batches instead of these huge shipments.\..\..

intro_1:
  faceset: SOJ_KEL
  faceindex: 5
  name: KEL
  text: Hey man,\. everything okay there?

intro_2:
  name: SHOPKEEP
  text: Oh!\! Hey KEL,\. oh and BASIL too.

intro_3:
  name: SHOPKEEP
  text: Yeah everything was goin' good until they shipped me a mountain of comics again.\! I got through most of them,\. but I honestly just wanna be done with this by now.\..\..

intro_4:
  faceset: SOJ_KEL
  faceindex: 12
  name: KEL
  text: Well if it's only a few chances are me and BASIL can put away the rest of them?

intro_5:
  name: SHOPKEEP
  text: Oh yeah!\! Please,\. help yourself. Just toss each of the comics into the genre they're in.\! If you get most of them right I'll pass you some cash.

intro_6:
  faceset: SOJ_KEL
  faceindex: 2
  name: KEL
  text: Sweet!\! Be done in no time!
  
intro_7:
  name: SHOPKEEP
  text: Thanks,\. man.\! And if you don't mind I'll be stepping outside for a minute.

outro_0:
  faceset: SOJ_BASIL
  faceindex: 0
  name: BASIL
  text: Well that was every comic.\! We should probably go tell SHOPKEEP.

outro_1:
  faceset: SOJ_BASIL
  faceindex: 14
  name: BASIL
  text: Nevermind.

outro_2:
  name: SHOPKEEP
  text: Hey guys,\. I'm back.\! Feeling a bit calmer.

outro_3:
  faceset: SOJ_KEL
  faceindex: 2
  name: KEL
  text: We put away all of the comics!

outro_4:
  name: SHOPKEEP
  text: Oh shoot!\! Thanks guys,\. seriously.

#12 correct
outro_5:
  name: SHOPKEEP
  text: Wow y'all were spot on it seems.\! Here,\. fourty bucks.

#8 correct
outro_6:
  name: SHOPKEEP
  text: Eh a few slip-ups it looks like, but I can't complain.\! Have a twenty.

#Any less
outro_7:
  name: SHOPKEEP
  text: Hm.\! Pretty haphazardous,\. but it's still put away so it's cool.\! I have a spare ten dollars for the effort.

outro_8:
  faceset: SOJ_KEL
  faceindex: 12
  name: KEL
  text: Thank you, SHOPKEEP!

outro_9:
  name: SHOPKEEP
  text: Any time,\. KEL!