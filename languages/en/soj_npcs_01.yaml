# when you annoy kel's dad too much

keldad_1:
  text: \n<KEL'S DAD>KEL,\. BASIL,\. can you please stop walking in front of the TV?

keldad_2:
  text: \n<KEL'S DAD>I'm being serious.

keldad_3:
  text: \n<KEL'S DAD>Okay,\. if you block the TV one more time,\. you're grounded.

keldad_3_1:
  text: \n<SALLY>\{\{\quake[2]BAH!

keldad_3_2:
  text: \n<KEL'S DAD>See?\! Even SALLY agrees!

keldad_3_3:
  faceset: SOJ_KEL
  faceindex: 3
  text: Sorry,\. DAD...\! It was funny.\kel

keldad_3_4:
  text: \n<KEL'S DAD>Ah,\. it's okay,\. champ.\! Just don't do it again!

