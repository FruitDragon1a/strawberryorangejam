# when you reach kel's mailbox
mail_tutorialend_1:
  faceset: SOJ_KEL
  faceindex: 5
  text: Okay,\. let's put it in.\kel

mail_tutorialend_2:
  text: You put the \c[4]\v[1967]\c[0] in the mailbox.

mail_tutorialend_3:
  faceset: SOJ_KEL
  faceindex: 2
  text: Great!\! \face[0]I'm going to go grab my bike.\! Give me a moment.\kel

mail_tutorialend_4:
